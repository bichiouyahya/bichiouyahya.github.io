# ─────────────────────────────────────────────────────────────
#  Site configuration — custom "terminal" theme by Yahya Bichiou
# ─────────────────────────────────────────────────────────────

title: Yahya Bichiou
tagline: Offensive Security | Web Exploitation
description: >-
  Offensive security writeups and web exploitation notes by Yahya Bichiou.

url: "https://bichiouyahya.github.io"
baseurl: ""

lang: en
timezone: Africa/Tunis

# ── Author / identity ────────────────────────────────────────
author:
  name: Yahya Bichiou
  email: info.bichiou.yahya@gmail.com

github:
  username: bichiouyahya

# Shown as the avatar in the hero / about
avatar: /assets/gill.jpg

# The shell prompt used throughout the UI → <user>@<host>:~$
prompt_user: yahya
prompt_host: bichiou

# Social links (first one is treated as the primary / copyright link)
social:
  name: Yahya Bichiou
  email: info.bichiou.yahya@gmail.com
  github: https://github.com/bichiouyahya
  linkedin: https://www.linkedin.com/in/yahya-bichiou

# ── Build settings ───────────────────────────────────────────
markdown: kramdown
highlighter: rouge
paginate: 8
paginate_path: /page:num/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - vendor
  - "*.gem"
  - "*.gemspec"
  - .devcontainer
  - node_modules
  - package*.json
