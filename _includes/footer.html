<footer class="site-footer">
  <div class="footer-links">
    {% if site.social.github %}
      <a href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    {% endif %}
    {% if site.social.linkedin %}
      <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
    {% endif %}
    {% if site.social.email %}
      <a href="mailto:{{ site.social.email }}" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    {% endif %}
    <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed"><i class="fa-solid fa-rss"></i></a>
  </div>

  <div class="footer-meta">
    <span class="footer-prompt">{{ site.prompt_user }}@{{ site.prompt_host }}:~$</span>
    echo "&copy; {{ 'now' | date: '%Y' }} {{ site.social.name }}"
  </div>
  <div class="footer-sub">
    built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">jekyll</a> &middot; no trackers &middot; hosted on github pages
  </div>
</footer>
